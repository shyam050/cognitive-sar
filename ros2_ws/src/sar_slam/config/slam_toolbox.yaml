# slam_toolbox online_async config for ONE robot.
# The launch file overrides base_frame / odom_frame / scan_topic per robot.
slam_toolbox:
  ros__parameters:
    odom_frame: robot_1_odom
    map_frame: map
    base_frame: robot_1_base_link
    scan_topic: /robot_1/scan
    mode: mapping
    debug_logging: false
    throttle_scans: 1
    transform_publish_period: 0.02
    map_update_interval: 2.0
    resolution: 0.05
    min_laser_range: 0.15
    max_laser_range: 4.9
    minimum_time_interval: 0.5
    transform_timeout: 0.3
    min_travel_distance: 0.15
    min_travel_heading: 0.15
    use_scan_matching: true
    use_scan_barycenter: true
    loop_search_maximum_distance: 3.0
    do_loop_closing: true
    loop_match_minimum_chain_size: 5
    loop_match_maximum_variance_coarse: 3.0
    loop_match_minimum_response_coarse: 0.35
    loop_match_minimum_response_fine: 0.45
